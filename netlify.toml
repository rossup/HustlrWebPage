# Netlify build settings for hustlr.chat
#
# The site is an Astro project: Netlify must build it and publish the built
# `dist` folder. Without this file Netlify served the repo as-is, so visitors
# got the old static index.html at the top of the repo instead of the Astro site.
# Settings here override the build settings in the Netlify dashboard.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 22.23.4 or newer
  NODE_VERSION = "24"
